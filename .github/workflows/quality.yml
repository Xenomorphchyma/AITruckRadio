name: Quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q ai_truck_radio.py ai_truck_radio_app tools tests

      - name: Pyright
        run: pyright

      - name: Tests
        run: pytest --cov -q

      - name: Bandit
        run: bandit -c pyproject.toml -r ai_truck_radio_app tools ai_truck_radio.py

      - name: Detect secrets
        shell: pwsh
        run: |
          detect-secrets scan --exclude-files '(^|[\\/])(\.venv|\.hf_cache|\.torch_cache|cache)([\\/]|$)' > secrets-scan.json
          $result = Get-Content secrets-scan.json -Raw | ConvertFrom-Json
          $count = ($result.results.PSObject.Properties | ForEach-Object { $_.Value.Count } | Measure-Object -Sum).Sum
          if ($count -gt 0) {
            throw "detect-secrets found $count potential secret(s)"
          }
